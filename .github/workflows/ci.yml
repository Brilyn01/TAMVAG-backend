name: TAMVA Backend CI/CD Governance

on:
  push:
    branches: [ main, "hardening/*", "feat/*", "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Run Verification Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'tamva' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'tamva_user' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || secrets.SPRING_DATASOURCE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Load Environment Variables from .env File (if present)
        run: |
          if [ -f .env ]; then
            echo "Loading environment variables from .env..."
            cat .env >> $GITHUB_ENV
          elif [ -f .env.test ]; then
            echo "Loading environment variables from .env.test..."
            cat .env.test >> $GITHUB_ENV
          fi

      - name: Run Gradle Test Suite & Verification
        env:
          TAMVA_DB_URL: ${{ secrets.TAMVA_DB_URL || 'jdbc:postgresql://localhost:5432/tamva' }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL || 'jdbc:postgresql://localhost:5432/tamva' }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME || 'tamva_user' }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD || secrets.POSTGRES_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST || 'localhost' }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
          REDIS_URL: ${{ secrets.REDIS_URL || 'redis://localhost:6379' }}
          TAMVA_JWT_SECRET: ${{ secrets.TAMVA_JWT_SECRET }}
          TAMVA_TEST_JWT_SECRET: ${{ secrets.TAMVA_TEST_JWT_SECRET }}
          TAMVA_WEBHOOK_ENCRYPTION_KEY: ${{ secrets.TAMVA_WEBHOOK_ENCRYPTION_KEY }}
          TAMVA_SEED_CLIENT_SECRET: ${{ secrets.TAMVA_SEED_CLIENT_SECRET }}
          PORT: 8080
        run: ./gradlew clean test --console=plain --no-daemon

  docker-build:
    name: Container Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Container
        run: docker build -t tamvag-backend:latest .