name: TAMVA Backend CI/CD Governance

on:
  push:
    branches: [ main, "hardening/*", "feat/*", "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Run Verification Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tamva
          POSTGRES_USER: tamva_user
          POSTGRES_PASSWORD: tamva_test_password_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle Test Suite & Verification
        env:
          TAMVA_DB_URL: jdbc:postgresql://localhost:5432/tamva
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tamva
          SPRING_DATASOURCE_USERNAME: tamva_user
          SPRING_DATASOURCE_PASSWORD: tamva_test_password_2026
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_URL: redis://localhost:6379
          TAMVA_JWT_SECRET: 261edf5ef58ff5e64455170c974783a97d66759bbc1ffb3a66ccd632f217b031
          TAMVA_TEST_JWT_SECRET: fa07f7202f41b534f8aff5ddd3650ffcb5a3cdf5385e03a43ab931096eeb5580
          TAMVA_WEBHOOK_ENCRYPTION_KEY: fe255c8e0d3ed0f9cee37296e0e50ae8
          TAMVA_SEED_CLIENT_SECRET: gcb-pilot-secret-2026
          PORT: 8080
        run: ./gradlew clean test --console=plain --no-daemon

  docker-build:
    name: Container Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Container
        run: docker build -t tamvag-backend:latest .