server:
  port: ${PORT:8080}

spring:
  application:
    name: TAMVAG-backend

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:tamvadb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis Configuration
  data:
    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # Kafka Configuration for Async Transaction Ingestion
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      # Upstash Kafka SASL/SSL (no-op locally when KAFKA_SASL_USERNAME is empty)
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: >
        ${KAFKA_SASL_JAAS_CONFIG:org.apache.kafka.common.security.plain.PlainLoginModule required username="" password="";}
    consumer:
      group-id: tamva-ingestion-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

tamva:
  risk:
    ruleset-version: ${TAMVA_RULESET_VERSION:rules-2026.09.1}

    new-device:
      code: R001
      score: 30
      window-hours: 24

    new-beneficiary:
      code: R002
      score: 25
      window-hours: 24

    unusual-amount:
      code: R003
      score: 25
      multiplier: 3.0
      minimum-amount: 1000.0
      new-customer-threshold: 5000.0
      new-customer-score: 20

    velocity:
      code: R004
      score: 30
      transaction-count-threshold: 4
      window-hours: 1

    account-drain:
      code: R005
      score: 20
      amount-threshold: 8000.0
      minimum-risk-score: 30

    weak-authentication:
      code: R006
      score: 15
      window-hours: 0

    decision-policy:
      challenge-threshold: 40
      hold-threshold: 70
      block-threshold: 90
  model-version: fraud-v3.2
  default-currency: GHS
  security:
    jwt-secret: ${TAMVA_JWT_SECRET:change-this-development-secret-to-a-long-random-value-2026}
    access-token-ttl-seconds: ${TAMVA_ACCESS_TOKEN_TTL_SECONDS:3600}
  kafka:
    enabled: false # Set to true only when a Kafka broker is available
    topics:
      transaction-received: tamva.transaction.received
      transaction-normalised: tamva.transaction.normalised
      transaction-dlq: tamva.transaction.dlq
  webhook:
    encryption-key: ${TAMVA_WEBHOOK_ENCRYPTION_KEY:change-this-development-webhook-encryption-key-32chars}
    max-attempts: ${TAMVA_WEBHOOK_MAX_ATTEMPTS:8}
    initial-retry-seconds: ${TAMVA_WEBHOOK_INITIAL_RETRY_SECONDS:30}
    max-retry-seconds: ${TAMVA_WEBHOOK_MAX_RETRY_SECONDS:3600}
    stale-delivery-seconds: ${TAMVA_WEBHOOK_STALE_DELIVERY_SECONDS:120}
    poll-interval-ms: ${TAMVA_WEBHOOK_POLL_INTERVAL_MS:5000}
