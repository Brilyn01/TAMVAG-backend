plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tamvagbackend'
version = '1.0.0'
description = 'TAMVA - Financial Identity & Trust Infrastructure Backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Core Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Authentication & Authorization
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    // Database & Migration
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'com.h2database:h2'

    // Async Messaging & Caching
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.kafka:spring-kafka'

    // OpenAPI / Swagger Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // JSON Date/Time support
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    environment 'TAMVA_DB_URL', 'jdbc:postgresql://localhost:5432/tamva'
    environment 'SPRING_DATASOURCE_URL', 'jdbc:postgresql://localhost:5432/tamva'
    environment 'SPRING_DATASOURCE_USERNAME', 'tamva_user'
    environment 'SPRING_DATASOURCE_PASSWORD', 'tamva_pass'
    environment 'SPRING_DATASOURCE_DRIVER_CLASS_NAME', 'org.postgresql.Driver'
    environment 'TAMVA_SEED_CLIENT_SECRET', 'gcb-pilot-secret-2026'
    environment 'TAMVA_TEST_JWT_SECRET', 'test-jwt-secret-2026-for-local-integration-testing-32chars!'
    environment 'TAMVA_JWT_SECRET', 'change-this-development-secret-to-a-long-random-value-2026'
    environment 'TAMVA_ACCESS_TOKEN_TTL_SECONDS', '3600'
    environment 'TAMVA_USER_ACCESS_TOKEN_TTL_SECONDS', '900'
    environment 'TAMVA_REFRESH_TOKEN_TTL_DAYS', '7'
    environment 'TAMVA_WEBHOOK_ENCRYPTION_KEY', 'change-this-development-webhook-encryption-key-32chars'
    environment 'TAMVA_WEBHOOK_MAX_ATTEMPTS', '8'
    environment 'TAMVA_WEBHOOK_INITIAL_RETRY_SECONDS', '30'
    environment 'TAMVA_WEBHOOK_MAX_RETRY_SECONDS', '3600'
    environment 'TAMVA_WEBHOOK_STALE_DELIVERY_SECONDS', '120'
    environment 'TAMVA_WEBHOOK_POLL_INTERVAL_MS', '5000'
    environment 'REDIS_HOST', 'localhost'
    environment 'REDIS_PORT', '6379'
    environment 'REDIS_URL', 'redis://localhost:6379'
}
