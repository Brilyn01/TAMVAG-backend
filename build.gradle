plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tamvagbackend'
version = '1.0.0'
description = 'TAMVA - Financial Identity & Trust Infrastructure Backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Core Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Authentication & Authorization
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    // Database & Migration
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'com.h2database:h2'

    // Async Messaging & Caching
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.kafka:spring-kafka'

    // OpenAPI / Swagger Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // JSON Date/Time support
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    environment 'TAMVA_DB_URL', System.getenv('TAMVA_DB_URL')
    environment 'SPRING_DATASOURCE_URL', System.getenv('SPRING_DATASOURCE_URL')
    environment 'SPRING_DATASOURCE_USERNAME', System.getenv('SPRING_DATASOURCE_USERNAME')
    environment 'SPRING_DATASOURCE_PASSWORD', System.getenv('SPRING_DATASOURCE_PASSWORD')
    environment 'SPRING_DATASOURCE_DRIVER_CLASS_NAME', System.getenv('SPRING_DATASOURCE_DRIVER_CLASS_NAME')
    environment 'TAMVA_SEED_CLIENT_SECRET', System.getenv('TAMVA_SEED_CLIENT_SECRET')
    environment 'TAMVA_TEST_JWT_SECRET', System.getenv('TAMVA_TEST_JWT_SECRET')
    environment 'TAMVA_JWT_SECRET', System.getenv('TAMVA_JWT_SECRET')
    environment 'TAMVA_ACCESS_TOKEN_TTL_SECONDS', System.getenv('TAMVA_ACCESS_TOKEN_TTL_SECONDS')
    environment 'TAMVA_USER_ACCESS_TOKEN_TTL_SECONDS', System.getenv('TAMVA_USER_ACCESS_TOKEN_TTL_SECONDS')
    environment 'TAMVA_REFRESH_TOKEN_TTL_DAYS', System.getenv('TAMVA_REFRESH_TOKEN_TTL_DAYS')
    environment 'TAMVA_WEBHOOK_ENCRYPTION_KEY', System.getenv('TAMVA_WEBHOOK_ENCRYPTION_KEY')
    environment 'TAMVA_WEBHOOK_MAX_ATTEMPTS', System.getenv('TAMVA_WEBHOOK_MAX_ATTEMPTS')
    environment 'TAMVA_WEBHOOK_INITIAL_RETRY_SECONDS', System.getenv('TAMVA_WEBHOOK_INITIAL_RETRY_SECONDS')
    environment 'TAMVA_WEBHOOK_MAX_RETRY_SECONDS', System.getenv('TAMVA_WEBHOOK_MAX_RETRY_SECONDS')
    environment 'TAMVA_WEBHOOK_STALE_DELIVERY_SECONDS', System.getenv('TAMVA_WEBHOOK_STALE_DELIVERY_SECONDS')
    environment 'TAMVA_WEBHOOK_POLL_INTERVAL_MS', System.getenv('TAMVA_WEBHOOK_POLL_INTERVAL_MS')
    environment 'REDIS_HOST', System.getenv('REDIS_HOST')
    environment 'REDIS_PORT', System.getenv('REDIS_PORT')
    environment 'REDIS_URL', System.getenv('REDIS_URL')
}
