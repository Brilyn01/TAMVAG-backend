services:
  - type: web
    name: tamva-backend
    runtime: docker
    plan: starter
    region: frankfurt # Or oregon/ohio
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        fromDatabase:
          name: tamva-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tamva-redis
          property: connectionString
      - key: TAMVA_JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080

  - type: redis
    name: tamva-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: tamva-postgres
    databaseName: tamva
    user: tamva_user
    plan: starter
    region: frankfurt
