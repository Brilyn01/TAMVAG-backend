services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tamva
      POSTGRES_USER: tamva_user
      POSTGRES_PASSWORD: tamva_pass
    ports:
      - "5432:5432"
    volumes:
      - tamva_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamva_user -d tamva"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tamva
      SPRING_DATASOURCE_USERNAME: tamva_user
      SPRING_DATASOURCE_PASSWORD: tamva_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  tamva_pg_data:
